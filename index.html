<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mina ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Sacramento&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #fce7f0 0%, #fff0f5 50%, #f7d6e0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            padding: 20px;
            color: #4a4a4a;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ANIMASI BUNGA, LOVE & SPARKLE JATUH --- */
        .falling-item {
            position: absolute;
            top: -50px;
            font-size: 20px;
            user-select: none;
            pointer-events: none !important;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }

        /* --- KOTAK JENDELA UTAMA --- */
        .window-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.96);
            background-image: radial-gradient(#f3c6df 1.5px, transparent 1.5px);
            background-size: 16px 16px;
            backdrop-filter: blur(10px);
            border: 2.5px solid #f3c6df;
            box-shadow: 0 15px 35px rgba(243, 198, 223, 0.6);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .decoration-corner-tl { position: absolute; top: 45px; left: 15px; font-size: 18px; z-index: 5; }
        .decoration-corner-tr { position: absolute; top: 45px; right: 15px; font-size: 18px; z-index: 5; }
        .decoration-corner-bl { position: absolute; bottom: 15px; left: 15px; font-size: 18px; z-index: 5; }
        .decoration-corner-br { position: absolute; bottom: 15px; right: 15px; font-size: 18px; z-index: 5; }

        /* --- HALAMAN SURAT ESTETIK VINTAGE --- */
        .letter-page {
            display: none;
            width: 100%;
            max-width: 580px;
            background: #fffdf9;
            background-image: linear-gradient(#f0e6df 1px, transparent 1px);
            background-size: 100% 2.4rem;
            border: 2px solid #e8d3c7;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), inset 0 0 35px rgba(243, 198, 223, 0.25);
            border-radius: 24px;
            padding: 45px 30px;
            position: relative;
            z-index: 20;
            text-align: left;
            animation: fadeIn 0.6s ease forwards;
            margin: 20px 0;
            max-height: 85vh;
            overflow-y: auto;
            line-height: 2.4rem;
        }

        .letter-page.active { display: block; }

        .letter-page::before {
            content: '🌹'; position: absolute; top: -18px; left: 30px;
            font-size: 28px; background: #fffdf9; padding: 0 8px;
            border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .letter-page::after {
            content: '💌'; position: absolute; top: -18px; right: 30px;
            font-size: 28px; background: #fffdf9; padding: 0 8px;
            border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .letter-content {
            font-size: 0.95rem; color: #4a4a4a;
            padding-right: 5px;
        }

        .letter-content p {
            margin-bottom: 2.4rem;
        }

        /* --- HALAMAN FLIP BOOK 3D SURPRISE --- */
        .surprise-page {
            display: none;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 2.5px solid #f3c6df;
            box-shadow: 0 20px 50px rgba(243, 198, 223, 0.7);
            border-radius: 24px;
            padding: 30px 20px;
            position: relative;
            z-index: 30;
            text-align: center;
            animation: fadeIn 0.8s ease forwards;
            margin: 20px 0;
        }

        .surprise-page.active { display: flex; flex-direction: column; align-items: center; }

        .chinese-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #d47a9e;
            margin-bottom: 2px;
            text-shadow: 0 2px 10px rgba(212, 122, 158, 0.3);
        }

        .subtitle-romantic {
            font-size: 0.85rem;
            color: #8c7a6b;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* WIDGET BUKU 3D */
        .book-container {
            width: 280px;
            height: 380px;
            position: relative;
            perspective: 1200px;
            margin-bottom: 20px;
        }

        .book-page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(243, 198, 223, 0.4);
            cursor: pointer;
            background: #ffffff;
            border: 2px solid #f3c6df;
            overflow: hidden;
        }

        .book-page.flipped {
            transform: rotateY(-180deg);
        }

        .page-front, .page-back {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .page-back {
            transform: rotateY(180deg);
            background: #fffdf9;
        }

        .cover-page {
            background: linear-gradient(135deg, #f8b8d0 0%, #f3c6df 50%, #fcd5e5 100%);
            border: 3px solid #e09bbd;
            text-align: center;
            position: relative;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .cover-ribbon {
            background: #ffffff;
            color: #d47a9e;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            border: 1.5px dashed #d47a9e;
        }

        .polaroid-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            border: 1.5px solid #f3c6df;
            box-shadow: 0 4px 12px rgba(243, 198, 223, 0.4);
            margin-bottom: 15px;
        }

        .polaroid-caption {
            font-family: 'Sacramento', cursive;
            font-size: 1.5rem;
            color: #d47a9e;
        }

        .book-nav-btn {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .nav-btn {
            background: #ffffff;
            border: 1.5px solid #f3c6df;
            color: #d47a9e;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(243, 198, 223, 0.3);
            transition: all 0.2s;
        }

        .nav-btn:active { transform: scale(0.95); background: #ffe6f0; }

        /* --- TITLE BAR UTAMA --- */
        .title-bar {
            background: #fff5f8; padding: 12px 18px; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #f3c6df;
        }

        .title-dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-minimize { background: #ffd166; }
        .dot-close { background: #ef476f; }
        .window-title { font-size: 0.8rem; color: #d47a9e; font-weight: 700; }

        /* --- ISI KONTEN --- */
        .window-body {
            padding: 20px 20px; text-align: center; min-height: 380px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.85);
            position: relative;
        }

        .screen { display: none; width: 100%; flex-direction: column; align-items: center; animation: fadeIn 0.4s ease forwards; }
        .screen.active { display: flex; }

        /* --- SPOTIFY PLAYLIST PILIHAN --- */
        .playlist-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 6px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .scroll-hint {
            font-size: 0.72rem;
            color: #d47a9e;
            font-weight: 700;
            margin-bottom: 10px;
            animation: bounceHint 1.5s infinite ease-in-out;
        }

        @keyframes bounceHint {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px); }
        }

        .spotify-card {
            background: #faf2f6; border: 1.5px solid #f3c6df; padding: 8px 10px;
            border-radius: 12px; width: 100%;
            display: flex; align-items: center; gap: 10px; text-align: left;
            cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(243, 198, 223, 0.2);
        }

        .spotify-card:hover, .spotify-card.selected {
            background: #ffe6f0;
            border-color: #ffb5a7;
            transform: scale(1.02);
        }

        .spotify-art {
            width: 34px; height: 34px; background: #ffb5a7; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; flex-shrink: 0;
            box-shadow: 0 3px 8px rgba(255, 181, 167, 0.5);
        }

        .spotify-info h4 { font-size: 0.78rem; color: #4a4a4a; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .spotify-info p { font-size: 0.68rem; color: #8c7a6b; }

        .instruction-text { font-size: 0.85rem; color: #6b6b6b; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }

        /* --- KOTAK KADO AWAL --- */
        .gift-wrapper { position: relative; cursor: pointer; display: inline-block; margin-bottom: 15px; z-index: 20; }
        .gift-box {
            font-size: 75px; animation: bounceGift 1.5s infinite ease-in-out;
            user-select: none; transition: transform 0.2s ease;
            filter: drop-shadow(0 8px 15px rgba(255, 181, 167, 0.6));
        }

        /* --- DESAIN BINGKAI KARTUN RAMAI --- */
        .typing-wrapper {
            width: 100%;
            background: #fff5f8;
            border: 2.5px dashed #f3c6df;
            border-radius: 18px;
            padding: 15px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(243, 198, 223, 0.35), 0 8px 20px rgba(243, 198, 223, 0.25);
            margin-bottom: 12px;
        }

        .typing-sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px dashed #f3c6df;
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-size: 0.75rem;
            color: #d47a9e;
            font-weight: 700;
        }

        .typing-container {
            font-size: 0.95rem; color: #d47a9e; font-weight: 700; line-height: 1.6;
            min-height: 75px; display: flex; justify-content: center;
            align-items: center; text-align: center;
            position: relative;
        }

        .cursor {
            display: inline-block; width: 2px; height: 18px;
            background-color: #d47a9e; animation: blink 0.8s infinite; margin-left: 4px;
        }

        /* --- DESAIN KUIS --- */
        .quiz-box { width: 100%; text-align: center; }
        .quiz-title { font-size: 0.75rem; color: #f08080; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; }
        .quiz-question { font-size: 0.9rem; font-weight: 700; color: #4a4a4a; margin-bottom: 12px; line-height: 1.4; }
        .quiz-options { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        
        .quiz-btn {
            background: #ffffff; border: 1.5px solid #f3c6df; padding: 10px 12px;
            border-radius: 12px; font-size: 0.8rem; font-weight: 600; color: #4a4a4a;
            cursor: pointer; transition: all 0.2s ease; font-family: 'Quicksand', sans-serif;
            box-shadow: 0 4px 10px rgba(243, 198, 223, 0.2);
            text-align: left;
        }

        .quiz-btn:active { transform: scale(0.97); background: #fff0f5; }

        /* --- HASIL KUIS / PESAN PENUTUP KUIS --- */
        .quiz-result-box {
            width: 100%;
            background: #fff5f8;
            border: 2px dashed #f3c6df;
            border-radius: 18px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(243, 198, 223, 0.35);
            margin-bottom: 15px;
        }

        .quiz-result-text {
            font-size: 0.9rem;
            color: #d47a9e;
            font-weight: 700;
            line-height: 1.7;
        }

        /* --- A LITTLE UNIVERSE (STABIL TANPA GOYANG) --- */
        .universe-box { width: 100%; text-align: center; }
        .universe-title { font-size: 1.1rem; font-weight: 700; color: #d47a9e; margin-bottom: 4px; }
        .universe-subtitle { font-size: 0.75rem; color: #8c7a6b; margin-bottom: 15px; }
        
        .stars-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .star-item {
            background: #fff5f8;
            border: 1.5px dashed #f3c6df;
            border-radius: 14px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(243, 198, 223, 0.3);
        }

        .star-item:hover, .star-item.clicked {
            background: #ffe6f0;
            border-color: #ffb5a7;
        }

        .star-svg {
            width: 32px;
            height: 32px;
            fill: #ffcc00;
            filter: drop-shadow(0 2px 5px rgba(255, 204, 0, 0.5));
        }

        .star-label { font-size: 0.72rem; color: #d47a9e; font-weight: 700; }

        /* --- MODAL / POP-UP SURAT KECIL (STABIL) --- */
        .star-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .star-modal-card {
            background: #fffdf9;
            background-image: linear-gradient(#f0e6df 1px, transparent 1px);
            background-size: 100% 2.2rem;
            border: 2px solid #e8d3c7;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-radius: 20px;
            padding: 25px 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            position: relative;
        }

        .star-modal-title {
            font-size: 0.8rem;
            color: #d47a9e;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 1.5px dashed #f3c6df;
            padding-bottom: 6px;
        }

        .star-modal-text {
            font-size: 0.88rem;
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .close-modal-btn {
            background: linear-gradient(135deg, #ffb5a7 0%, #f08080 100%);
            color: #ffffff; border: none; padding: 8px 20px; font-size: 0.8rem;
            font-weight: 700; cursor: pointer; border-radius: 50px;
            box-shadow: 0 4px 12px rgba(255, 181, 167, 0.5);
            font-family: 'Quicksand', sans-serif;
        }

        /* --- TOMBOL MODERN --- */
        .modern-btn {
            background: linear-gradient(135deg, #ffb5a7 0%, #f08080 100%);
            color: #ffffff; border: none; padding: 10px 24px; font-size: 0.85rem;
            font-weight: 700; cursor: pointer; box-shadow: 0 6px 15px rgba(255, 181, 167, 0.5);
            transition: all 0.2s ease; margin-top: 5px; border-radius: 50px;
            position: relative; z-index: 20; font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .modern-btn:active { transform: scale(0.95); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes bounceGift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
</head>
