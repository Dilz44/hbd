<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mina ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Sacramento&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #e6f0fa url('bg1.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            padding: 20px;
            color: #4a4a4a;
            overflow: hidden;
            position: relative;
        }

        /* --- OVERLAY STABIL --- */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            z-index: 1;
        }

        /* --- PARTIKEL JATUH SMOOTH --- */
        .falling-particle {
            position: absolute;
            top: -40px;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: smoothFall linear infinite;
            z-index: 2;
        }

        @keyframes smoothFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.15; }
        }

        /* --- KOTAK UTAMA (GAYA MODERN CLEAN) --- */
        .main-wrapper {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid #f3c6df;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        /* --- TOP BAR ESTETIK --- */
        .app-header {
            background: #fff5f8;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #fbdde9;
        }

        .header-dots { display: flex; gap: 6px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .dot-yellow { background: #ffd166; }
        .dot-red { background: #ef476f; }
        .app-title { font-size: 0.78rem; color: #d47a9e; font-weight: 700; letter-spacing: 0.5px; }

        /* --- KONTEN CONTAINER --- */
        .app-body {
            padding: 25px 20px;
            min-height: 360px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .view-panel {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .view-panel.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        /* --- SPOTIFY LIST --- */
        .music-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 160px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 12px;
        }

        .music-item {
            background: #faf2f6;
            border: 1.5px solid #fbdde9;
            padding: 10px 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .music-item.active-song {
            background: #ffe6f0;
            border-color: #ffb5a7;
            transform: scale(1.02);
        }

        .music-icon {
            width: 36px; height: 36px;
            background: #ffb5a7;
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .music-meta h4 { font-size: 0.8rem; color: #4a4a4a; font-weight: 700; }
        .music-meta p { font-size: 0.7rem; color: #8c7a6b; }

        .hint-scroll {
            font-size: 0.72rem;
            color: #d47a9e;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* --- KOTAK KADO INTERAKTIF --- */
        .gift-box-area {
            position: relative;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 15px;
            animation: giftFloat 2s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        .gift-box-area:active { transform: scale(0.9); }

        .gift-emoji {
            font-size: 80px;
            filter: drop-shadow(0 10px 20px rgba(255, 181, 167, 0.5));
        }

        @keyframes giftFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .countdown-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .countdown-digits {
            font-size: 4.5rem;
            font-weight: 700;
            color: #d47a9e;
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 4px 12px rgba(212, 122, 158, 0.25);
        }

        /* --- KOTAK TEKS KETIK --- */
        .typewriter-box {
            width: 100%;
            background: #fff5f8;
            border: 2px dashed #fbdde9;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 12px rgba(243, 198, 223, 0.3);
        }

        .typewriter-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px dashed #fbdde9;
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-size: 0.75rem;
            color: #d47a9e;
            font-weight: 700;
        }

        .typewriter-text {
            font-size: 0.92rem;
            color: #d47a9e;
            font-weight: 700;
            line-height: 1.6;
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .blinking-caret {
            display: inline-block;
            width: 2px;
            height: 16px;
            background-color: #d47a9e;
            animation: cursorBlink 0.8s infinite;
            margin-left: 3px;
        }

        @keyframes cursorBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

        /* --- KUIS INTERAKTIF --- */
        .quiz-container { width: 100%; text-align: center; }
        .quiz-indicator { font-size: 0.72rem; color: #f08080; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
        .quiz-ask { font-size: 0.88rem; font-weight: 700; color: #4a4a4a; margin-bottom: 14px; line-height: 1.4; }
        .quiz-choices { display: flex; flex-direction: column; gap: 8px; width: 100%; }

        .choice-btn {
            background: #ffffff;
            border: 1.5px solid #fbdde9;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a4a4a;
            cursor: pointer;
            text-align: left;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.2s ease;
        }

        .choice-btn:active { background: #ffe6f0; transform: scale(0.98); }

        .quiz-finish-card {
            width: 100%;
            background: #fff5f8;
            border: 2px dashed #fbdde9;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            margin-bottom: 15px;
        }

        .quiz-finish-msg {
            font-size: 0.85rem;
            color: #d47a9e;
            font-weight: 700;
            line-height: 1.6;
        }

        /* --- BINTANG KEBERUNTUNGAN (STABIL) --- */
        .stars-layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }

        .star-box {
            background: #fff5f8;
            border: 1.5px dashed #fbdde9;
            border-radius: 14px;
            padding: 12px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .star-box:active { transform: scale(0.95); }
        .star-box.unlocked { background: #ffe6f0; border-color: #ffb5a7; }

        .star-icon-svg { width: 30px; height: 30px; fill: #ffcc00; }
        .star-text-label { font-size: 0.72rem; color: #d47a9e; font-weight: 700; }

        /* --- MODAL POPUP BINTANG --- */
        .modal-shade {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: #fffdf9;
            background-image: linear-gradient(#f0e6df 1px, transparent 1px);
            background-size: 100% 2.2rem;
            border: 2px solid #e8d3c7;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 24px 20px;
            width: 100%;
            max-width: 310px;
            text-align: center;
        }

        .modal-title {
            font-size: 0.8rem;
            color: #d47a9e;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 1.5px dashed #f3c6df;
            padding-bottom: 6px;
        }

        .modal-content-text {
            font-size: 0.86rem;
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 18px;
            font-weight: 600;
        }

        /* --- HALAMAN SURAT PANJANG --- */
        .letter-container-page {
            display: none;
            width: 100%;
            max-width: 580px;
            background: #fffdf9;
            background-image: linear-gradient(#f0e6df 1px, transparent 1px);
            background-size: 100% 2.4rem;
            border: 2px solid #e8d3c7;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border-radius: 24px;
            padding: 45px 30px;
            position: relative;
            z-index: 20;
            text-align: left;
            margin: 20px 0;
            max-height: 85vh;
            overflow-y: auto;
            line-height: 2.4rem;
        }

        .letter-container-page.active { display: block; }

        .letter-container-page::before {
            content: '🌹'; position: absolute; top: -18px; left: 30px;
            font-size: 28px; background: #fffdf9; padding: 0 8px; border-radius: 50%;
        }

        .letter-container-page::after {
            content: '💌'; position: absolute; top: -18px; right: 30px;
            font-size: 28px; background: #fffdf9; padding: 0 8px; border-radius: 50%;
        }

        .letter-inner-body { font-size: 0.95rem; color: #4a4a4a; }
        .letter-inner-body p { margin-bottom: 2.4rem; }

        /* --- ALBUM FOTO 3D FLIPBOOK --- */
        .album-page-box {
            display: none;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.98);
            border: 2.5px solid #f3c6df;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            padding: 30px 20px;
            position: relative;
            z-index: 30;
            text-align: center;
            margin: 20px 0;
        }

        .album-page-box.active { display: flex; flex-direction: column; align-items: center; }

        .album-title-main { font-size: 1.8rem; font-weight: 700; color: #d47a9e; margin-bottom: 2px; }
        .album-subtitle-main { font-size: 0.85rem; color: #8c7a6b; margin-bottom: 18px; font-weight: 600; }

        .book-stage {
            width: 280px;
            height: 380px;
            position: relative;
            perspective: 1400px;
            margin-bottom: 18px;
        }

        .sheet {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            background: #ffffff;
            border: 2px solid #f3c6df;
            overflow: hidden;
        }

        .sheet.turned { transform: rotateY(-180deg); }

        .sheet-front, .sheet-back {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            backface-visibility: hidden;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .sheet-back { transform: rotateY(180deg); background: #fffdf9; }

        .cover-bg-art {
            background: url('bg2.jpg') no-repeat center center;
            background-size: cover;
            border: 3px solid #e09bbd;
            text-align: center;
        }

        .cover-tag {
            background: rgba(255, 255, 255, 0.9);
            color: #2b5b84;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 12px;
            border: 1.5px dashed #2b5b84;
        }

        .polaroid-photo {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            border: 1.5px solid #f3c6df;
            box-shadow: 0 4px 12px rgba(243, 198, 223, 0.4);
            margin-bottom: 12px;
        }

        .polaroid-sign {
            font-family: 'Sacramento', cursive;
            font-size: 1.5rem;
            color: #d47a9e;
        }

        .book-controls { display: flex; gap: 15px; margin-bottom: 10px; }

        .ctrl-btn {
            background: #ffffff;
            border: 1.5px solid #f3c6df;
            color: #d47a9e;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(243, 198, 223, 0.3);
        }

        /* --- TOMBOL UTAMA --- */
        .action-btn {
            background: linear-gradient(135deg, #ffb5a7 0%, #f08080 100%);
            color: #ffffff; border: none; padding: 10px 24px; font-size: 0.85rem;
            font-weight: 700; cursor: pointer; border-radius: 50px;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 4px 15px rgba(240, 128, 128, 0.4);
            transition: transform 0.2s ease;
        }

        .action-btn:active { transform: scale(0.95); }
    </style>
</head>
