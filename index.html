<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mina ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Sacramento&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #e6f0fa url('bg1.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            padding: 20px;
            color: #4a4a4a;
            overflow-x: hidden;
            position: relative;
        }

        /* --- PARTIKEL JATUH SAAT KADO --- */
        .falling-particle {
            position: absolute;
            top: -50px;
            font-size: 22px;
            user-select: none;
            pointer-events: none !important;
            animation: particleFall linear infinite;
            z-index: 2;
        }

        @keyframes particleFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }

        /* --- KOTAK UTAMA (STABIL 100%) --- */
        .window-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            background-image: radial-gradient(#f3c6df 1.5px, transparent 1.5px);
            background-size: 16px 16px;
            border: 2.5px solid #f3c6df;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .decoration-corner-tl { position: absolute; top: 45px; left: 15px; font-size: 18px; z-index: 5; }
        .decoration-corner-tr { position: absolute; top: 45px; right: 15px; font-size: 18px; z-index: 5; }
        .decoration-corner-bl { position: absolute; bottom: 15px; left: 15px; font-size: 18px; z-index: 5; }
        .decoration-corner-br { position: absolute; bottom: 15px; right: 15px; font-size: 18px; z-index: 5; }

        /* --- SURAT VINTAGE --- */
        .letter-page {
            display: none;
            width: 100%;
            max-width: 580px;
            background: #fffdf9;
            background-image: linear-gradient(#f0e6df 1px, transparent 1px);
            background-size: 100% 2.4rem;
            border: 2px solid #e8d3c7;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border-radius: 24px;
            padding: 45px 30px;
            position: relative;
            z-index: 20;
            text-align: left;
            margin: 20px 0;
            max-height: 85vh;
            overflow-y: auto;
            line-height: 2.4rem;
        }

        .letter-page.active { display: block; }

        .letter-page::before {
            content: '🌹'; position: absolute; top: -18px; left: 30px;
            font-size: 28px; background: #fffdf9; padding: 0 8px; border-radius: 50%;
        }

        .letter-page::after {
            content: '💌'; position: absolute; top: -18px; right: 30px;
            font-size: 28px; background: #fffdf9; padding: 0 8px; border-radius: 50%;
        }

        .letter-content { font-size: 0.95rem; color: #4a4a4a; padding-right: 5px; }
        .letter-content p { margin-bottom: 2.4rem; }

        /* --- BUKU 3D ALBUM (6 HALAMAN LENGKAP) --- */
        .surprise-page {
            display: none;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            border: 2.5px solid #f3c6df;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            padding: 30px 20px;
            position: relative;
            z-index: 30;
            text-align: center;
            margin: 20px 0;
        }

        .surprise-page.active { display: flex; flex-direction: column; align-items: center; }

        .chinese-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #d47a9e;
            margin-bottom: 2px;
        }

        .subtitle-romantic {
            font-size: 0.85rem;
            color: #8c7a6b;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .book-container {
            width: 280px;
            height: 380px;
            position: relative;
            perspective: 1200px;
            margin-bottom: 20px;
        }

        .book-page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: left center;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            background: #ffffff;
            border: 2px solid #f3c6df;
            overflow: hidden;
        }

        .book-page.flipped {
            transform: rotateY(-180deg);
        }

        .page-front, .page-back {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .page-back {
            transform: rotateY(180deg);
            background: #fffdf9;
        }

        .cover-page {
            background: url('bg2.jpg') no-repeat center center;
            background-size: cover;
            border: 3px solid #e09bbd;
            text-align: center;
            position: relative;
        }

        .cover-ribbon {
            background: rgba(255, 255, 255, 0.9);
            color: #2b5b84;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 15px;
            border: 1.5px dashed #2b5b84;
        }

        .polaroid-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            border: 1.5px solid #f3c6df;
            box-shadow: 0 4px 12px rgba(243, 198, 223, 0.4);
            margin-bottom: 15px;
        }

        .polaroid-caption {
            font-family: 'Sacramento', cursive;
            font-size: 1.5rem;
            color: #d47a9e;
        }

        .book-nav-btn {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .nav-btn {
            background: #ffffff;
            border: 1.5px solid #f3c6df;
            color: #d47a9e;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(243, 198, 223, 0.3);
        }

        /* --- TITLE BAR --- */
        .title-bar {
            background: #fff5f8; padding: 12px 18px; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #f3c6df;
        }

        .title-dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-minimize { background: #ffd166; }
        .dot-close { background: #ef476f; }
        .window-title { font-size: 0.8rem; color: #d47a9e; font-weight: 700; }

        .window-body {
            padding: 20px 20px; text-align: center; min-height: 380px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.85);
            position: relative;
        }

        .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }

        /* --- SPOTIFY PLAYLIST --- */
        .playlist-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 6px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .scroll-hint {
            font-size: 0.72rem;
            color: #d47a9e;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .spotify-card {
            background: #faf2f6; border: 1.5px solid #f3c6df; padding: 8px 10px;
            border-radius: 12px; width: 100%;
            display: flex; align-items: center; gap: 10px; text-align: left;
            cursor: pointer;
        }

        .spotify-card.selected {
            background: #ffe6f0;
            border-color: #ffb5a7;
        }

        .spotify-art {
            width: 34px; height: 34px; background: #ffb5a7; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; flex-shrink: 0;
        }

        .spotify-info h4 { font-size: 0.78rem; color: #4a4a4a; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .spotify-info p { font-size: 0.68rem; color: #8c7a6b; }

        .instruction-text { font-size: 0.85rem; color: #6b6b6b; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }

        /* --- KOTAK KADO --- */
        .gift-wrapper { 
            position: relative; 
            cursor: pointer; 
            display: inline-block; 
            margin-bottom: 10px; 
            z-index: 20; 
            animation: bounceGift 1.5s infinite ease-in-out;
        }

        .gift-box {
            font-size: 75px;
            user-select: none;
            filter: drop-shadow(0 8px 15px rgba(255, 181, 167, 0.6));
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .countdown-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .countdown-number {
            font-size: 4rem;
            font-weight: 700;
            color: #d47a9e;
            text-shadow: 0 4px 15px rgba(212, 122, 158, 0.3);
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .countdown-label {
            font-size: 0.85rem;
            color: #8c7a6b;
            font-weight: 600;
        }

        /* --- EFEK KETIK TEKS --- */
        .typing-wrapper {
            width: 100%;
            background: #fff5f8;
            border: 2.5px dashed #f3c6df;
            border-radius: 18px;
            padding: 15px;
            position: relative;
            margin-bottom: 12px;
            box-shadow: inset 0 0 15px rgba(243, 198, 223, 0.35);
        }

        .typing-sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px dashed #f3c6df;
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-size: 0.75rem;
            color: #d47a9e;
            font-weight: 700;
        }

        .typing-container {
            font-size: 0.95rem; color: #d47a9e; font-weight: 700; line-height: 1.6;
            min-height: 75px; display: flex; justify-content: center;
            align-items: center; text-align: center;
            position: relative;
        }

        .cursor {
            display: inline-block; width: 2px; height: 18px;
            background-color: #d47a9e; animation: blink 0.8s infinite; margin-left: 4px;
        }

        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

        /* --- KUIS --- */
        .quiz-box { width: 100%; text-align: center; }
        .quiz-title { font-size: 0.75rem; color: #f08080; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; }
        .quiz-question { font-size: 0.9rem; font-weight: 700; color: #4a4a4a; margin-bottom: 12px; line-height: 1.4; }
        .quiz-options { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        
        .quiz-btn {
            background: #ffffff; border: 1.5px solid #f3c6df; padding: 10px 12px;
            border-radius: 12px; font-size: 0.8rem; font-weight: 600; color: #4a4a4a;
            cursor: pointer; font-family: 'Quicksand', sans-serif;
            text-align: left;
        }

        .quiz-result-box {
            width: 100%;
            background: #fff5f8;
            border: 2px dashed #f3c6df;
            border-radius: 18px;
            padding: 20px 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .quiz-result-text {
            font-size: 0.88rem;
            color: #d47a9e;
            font-weight: 700;
            line-height: 1.6;
        }

        /* --- BINTANG (DIJAMIN KAKU & STABIL) --- */
        .universe-box { width: 100%; text-align: center; }
        .universe-title { font-size: 1.1rem; font-weight: 700; color: #d47a9e; margin-bottom: 4px; }
        .universe-subtitle { font-size: 0.75rem; color: #8c7a6b; margin-bottom: 15px; }
        
        .stars-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .star-item {
            background: #fff5f8;
            border: 1.5px dashed #f3c6df;
            border-radius: 14px;
            padding: 12px 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transform: none !important;
            animation: none !important;
        }

        .star-item.clicked {
            background: #ffe6f0;
            border-color: #ffb5a7;
        }

        .star-svg {
            width: 32px;
            height: 32px;
            fill: #ffcc00;
            transform: none !important;
            animation: none !important;
        }

        .star-label { font-size: 0.72rem; color: #d47a9e; font-weight: 700; }

        /* --- MODAL BINTANG (STABIL) --- */
        .star-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .star-modal-card {
            background: #fffdf9;
            background-image: linear-gradient(#f0e6df 1px, transparent 1px);
            background-size: 100% 2.2rem;
            border: 2px solid #e8d3c7;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 25px 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            position: relative;
            transform: none !important;
            animation: none !important;
        }

        .star-modal-title {
            font-size: 0.8rem;
            color: #d47a9e;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 1.5px dashed #f3c6df;
            padding-bottom: 6px;
        }

        .star-modal-text {
            font-size: 0.88rem;
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .close-modal-btn {
            background: linear-gradient(135deg, #ffb5a7 0%, #f08080 100%);
            color: #ffffff; border: none; padding: 8px 20px; font-size: 0.8rem;
            font-weight: 700; cursor: pointer; border-radius: 50px;
            font-family: 'Quicksand', sans-serif;
        }

        .modern-btn {
            background: linear-gradient(135deg, #ffb5a7 0%, #f08080 100%);
            color: #ffffff; border: none; padding: 10px 24px; font-size: 0.85rem;
            font-weight: 700; cursor: pointer; border-radius: 50px;
            position: relative; z-index: 20; font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <!-- AUDIO -->
    <audio id="bg-music" loop preload="auto"></audio>

    <!-- KOTAK UTAMA -->
    <div class="window-card" id="main-container">
        <span class="decoration-corner-tl">🌸</span>
        <span class="decoration-corner-tr">✨</span>
        <span class="decoration-corner-bl">💖</span>
        <span class="decoration-corner-br">🌷</span>

        <div class="title-bar">
            <span class="window-title">birthday_gift.exe</span>
            <div class="title-dots">
                <span class="dot dot-minimize"></span>
                <span class="dot dot-close"></span>
            </div>
        </div>

        <div class="window-body">
            
            <!-- HALAMAN 1: PLAYLIST -->
            <div class="screen active" id="page-1">
                <div class="instruction-text">请先选择你喜欢的音乐，宝贝 🎶</div>
                
                <div class="playlist-container">
                    <div class="spotify-card selected" onclick="selectSong('Mitski - My Love Mine All Mine.mp3', this)">
                        <div class="spotify-art">🎵</div>
                        <div class="spotify-info">
                            <h4>My Love Mine All Mine</h4>
                            <p>Mitski</p>
                        </div>
                    </div>
                    <div class="spotify-card" onclick="selectSong('Taylor Swift - Love Story (Lyrics).mp3', this)">
                        <div class="spotify-art">🎵</div>
                        <div class="spotify-info">
                            <h4>Love Story</h4>
                            <p>Taylor Swift</p>
                        </div>
                    </div>
                    <div class="spotify-card" onclick="selectSong('Ed Sheeran - Perfect.mp3', this)">
                        <div class="spotify-art">🎵</div>
                        <div class="spotify-info">
                            <h4>Perfect</h4>
                            <p>Ed Sheeran</p>
                        </div>
                    </div>
                    <div class="spotify-card" onclick="selectSong('The 1975 - About You.mp3', this)">
                        <div class="spotify-art">🎵</div>
                        <div class="spotify-info">
                            <h4>About You</h4>
                            <p>The 1975</p>
                        </div>
                    </div>
                </div>
                
                <div class="scroll-hint">▼ 向下滚动查看更多歌曲 ▼</div>

                <button class="modern-btn" onclick="goToPage2()">开始 💖</button>
            </div>

            <!-- HALAMAN 2: KADO & HITUNG MUNDUR -->
            <div class="screen" id="page-2">
                <div class="gift-wrapper" id="gift-box-container" onclick="startGiftCountdown()">
                    <div class="gift-box">🎁</div>
                </div>
                <div class="instruction-text" id="gift-instruction">你有一个小礼物！<br><span style="font-size: 0.8rem; color: #b0b0b0;">( 请点击礼盒 )</span></div>

                <div class="countdown-box" id="countdown-display" style="display: none;">
                    <div class="countdown-number" id="countdown-num">5</div>
                    <div class="countdown-label">✨ 准备接收惊喜... ✨</div>
                </div>
            </div>

            <!-- HALAMAN 3: EFEK KETIK TEKS -->
            <div class="screen" id="page-3">
                <div class="typing-wrapper">
                    <div class="typing-
